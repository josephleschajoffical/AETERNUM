# Aeternum Security OS - system hardening, applied at every boot.
# See docs/HARDENING.md for what each setting does and why.
# Settings marked STRICT are commented out: enable them after the system has
# been tested on real hardware, because they can break programs.

# --- Address space layout randomization (ASLR) ---
# 64-bit ASLR is already the default; 32-bit programs are not randomized by default.
kern.elf64.aslr.enable=1
kern.elf64.aslr.pie_enable=1
kern.elf64.aslr.honor_sbrk=0
kern.elf32.aslr.enable=1
kern.elf32.aslr.pie_enable=1

# --- Isolation between users and processes ---
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.see_jail_proc=0
security.bsd.unprivileged_read_msgbuf=0
security.bsd.conservative_signals=1
security.bsd.hardlink_check_uid=1
security.bsd.hardlink_check_gid=1

# --- No core dumps (they can contain passwords and keys) ---
kern.coredump=0
kern.sugid_coredump=0

# --- Network hardening ---
net.inet.ip.random_id=1
net.inet.ip.redirect=0
net.inet6.ip6.redirect=0
net.inet.icmp.drop_redirect=1
net.inet.icmp.bmcastecho=0
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1
net.inet.tcp.drop_synfin=1
net.inet.tcp.syncookies=1
net.inet.tcp.nolocaltimewait=1

# --- CPU vulnerability mitigations ---
machdep.mitigations.taa.enable=1
machdep.mitigations.rngds.enable=1

# --- STRICT (disabled until tested) ---
# Refuse ELF programs with segments that are both writable and executable.
#kern.elf64.allow_wx=0
#kern.elf32.allow_wx=0
# Block debugging of processes by unprivileged users (also breaks gdb as a normal user).
#security.bsd.unprivileged_proc_debug=0
